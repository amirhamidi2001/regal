services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_COLLECTSTATIC: "0"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
      - static_data:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
